services:
  mysql:
    image: mysql:8.0
    container_name: tickets_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USER:-tickets}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tickets}
      MYSQL_DATABASE: ${DB_NAME:-tickets}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-tickets}", "-p${DB_PASSWORD:-tickets}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: tickets_adminer
    environment:
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  backend:
    build: ./backend
    container_name: tickets_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-tickets}
      DB_PASSWORD: ${DB_PASSWORD:-tickets}
      DB_NAME: ${DB_NAME:-tickets}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tickets_frontend
    restart: always
    environment:
      VITE_API_URL: http://216.146.25.231:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
